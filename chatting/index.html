<!DOCTYPE html>
<html>
<head>
  <title>My Chat Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: lightblue;
      color: black;
    }

    .topbar {
      background-color: navy;
      color: white;
      padding: 15px;
      border-bottom: 4px solid black;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .back-link {
      color: yellow;
      float: right;
      margin-top: -25px;
    }

    #login {
      background-color: white;
      border: 3px solid black;
      width: 300px;
      margin: 80px auto;
      padding: 25px;
      text-align: center;
    }

    #login input,
    #login select,
    #login button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      border: 2px solid black;
      box-sizing: border-box;
    }

    #login button {
      background-color: limegreen;
      cursor: pointer;
    }

    #chat {
      display: none;
      height: calc(100vh - 70px);
    }

    .room-bar {
      background-color: white;
      padding: 10px;
      border-bottom: 3px solid black;
    }

    .room-bar select {
      padding: 5px;
      border: 2px solid black;
    }

    #messages {
      background-color: white;
      border: 3px solid black;
      margin: 10px;
      padding: 10px;
      height: calc(100vh - 180px);
      overflow-y: scroll;
      list-style: none;
    }

    #messages li {
      padding: 8px;
      border-bottom: 1px dotted gray;
    }

    #messages li.system {
      color: gray;
      font-style: italic;
    }

    #messages li b {
      color: blue;
    }

    .time {
      color: gray;
      font-size: 11px;
      margin-left: 5px;
    }

    #msg-form {
      display: flex;
      gap: 5px;
      padding: 10px;
    }

    #msg-input {
      flex: 1;
      padding: 10px;
      border: 2px solid black;
      font-size: 16px;
    }

    #msg-form button {
      padding: 10px;
      border: 2px solid black;
      background-color: yellow;
      cursor: pointer;
      font-weight: bold;
    }

    #gif-picker {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 10px;
      width: 400px;
      height: 300px;
      background-color: white;
      border: 4px solid black;
      padding: 10px;
    }

    #gif-picker.show {
      display: block;
    }

    #gif-search {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 2px solid black;
      margin-bottom: 10px;
    }

    #gif-results {
      height: 250px;
      overflow-y: scroll;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    #gif-results img {
      width: 100%;
      cursor: pointer;
      border: 2px solid black;
    }

    #gif-status {
      padding: 10px;
      color: gray;
    }

    .gif-message {
      max-width: 220px;
      margin-top: 5px;
      border: 2px solid black;
    }
  </style>
</head>

<body>

    <a class="back-link" href="/">
      &lt; Back to Game Library
    </a>
  </div>


  <!-- LOGIN AREA -->
  <div id="login">

    <h2>Join My Chat</h2>

    <input
      id="username"
      type="text"
      placeholder="Your username"
      maxlength="20"
    >

    <select id="room-select">
      <option value="General">General</option>
      <option value="Random">Random</option>
      <option value="Tech Talk">Tech Talk</option>
    </select>

    <button id="join-btn">
      JOIN CHAT
    </button>

  </div>


  <!-- CHAT AREA -->
  <div id="chat">

    <div class="room-bar">
      <b>Current Room:</b>

      <select id="room-switch">
        <option value="General">General</option>
        <option value="Random">Random</option>
        <option value="Tech Talk">Tech Talk</option>
      </select>
    </div>


    <ul id="messages"></ul>


    <!-- GIF THING -->
    <div id="gif-picker">

      <input
        id="gif-search"
        type="text"
        placeholder="Search for a GIF"
      >

      <div id="gif-results"></div>

    </div>


    <!-- MESSAGE BOX -->
    <form id="msg-form">

      <button type="button" id="gif-btn">
        GIF
      </button>

      <input
        id="msg-input"
        type="text"
        placeholder="Type your message here..."
        autocomplete="off"
      >

      <button type="submit">
        SEND
      </button>

    </form>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDRwajbbci9yOPaiM3vI6qdEl6B33bSPzo",
      authDomain: "chatter-a179c.firebaseapp.com",
      databaseURL: "https://chatter-a179c-default-rtdb.firebaseio.com",
      projectId: "chatter-a179c",
      storageBucket: "chatter-a179c.firebasestorage.app",
      messagingSenderId: "643934566239",
      appId: "1:643934566239:web:390ae5ed2ab5f212a8a8ea"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();


    let username = "";
    let currentRoom = null;
    let roomRef = null;


    const loginDiv = document.getElementById("login");
    const chatDiv = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const roomSwitch = document.getElementById("room-switch");


    // JOIN CHAT
    document.getElementById("join-btn").onclick = function() {

      const name = document.getElementById("username").value.trim();
      const room = document.getElementById("room-select").value;

      if (!name) {
        alert("You need to type a username!");
        return;
      }

      username = name;

      loginDiv.style.display = "none";
      chatDiv.style.display = "block";

      roomSwitch.value = room;

      joinRoom(room);
    };


    // CHANGE ROOM
    roomSwitch.onchange = function(event) {
      joinRoom(event.target.value);
    };


    function joinRoom(room) {

      if (roomRef) {
        roomRef.off();
      }

      currentRoom = room;

      messages.innerHTML = "";

      roomRef = db.ref(
        "rooms/" + room + "/messages"
      );

      const startAt = Date.now();


      roomRef.on("child_added", function(snapshot) {

        const msg = snapshot.val();

        if (
          msg.time < startAt &&
          !msg.isJoinNotice
        ) {
          return;
        }

        addMessage(msg);

      });


      roomRef.push({
        system: true,
        text: username + " joined the room.",
        time: Date.now(),
        isJoinNotice: true
      });

    }


    function addMessage(msg) {

      const li = document.createElement("li");


      // SYSTEM MESSAGE
      if (msg.system) {

        li.className = "system";
        li.textContent = msg.text;

      }


      // GIF MESSAGE
      else if (msg.gifUrl) {

        const time =
          new Date(msg.time).toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

        li.innerHTML =
          "<b>" +
          escapeHtml(msg.user) +
          "</b>" +

          "<span class='time'>" +
          time +
          "</span>" +

          "<br>" +

          "<img class='gif-message' src='" +
          escapeHtml(msg.gifUrl) +
          "' alt='GIF'>";

      }


      // NORMAL MESSAGE
      else {

        const time =
          new Date(msg.time).toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

        li.innerHTML =
          "<b>" +
          escapeHtml(msg.user) +
          "</b>" +

          "<span class='time'>" +
          time +
          "</span>" +

          "<br>" +

          escapeHtml(msg.text);

      }


      messages.appendChild(li);

      messages.scrollTop =
        messages.scrollHeight;

    }


    // SEND MESSAGE
    document.getElementById("msg-form").onsubmit =
      function(event) {

        event.preventDefault();

        const input =
          document.getElementById("msg-input");

        const text = input.value.trim();

        if (!text || !roomRef) {
          return;
        }

        roomRef.push({
          user: username,
          text: text,
          time: Date.now()
        });

        input.value = "";

      };


    // STOP HTML FROM BREAKING
    function escapeHtml(str) {

      const div =
        document.createElement("div");

      div.textContent = str;

      return div.innerHTML;

    }


    // ==========================
    // GIF STUFF
    // ==========================

    const GIPHY_API_KEY =
      "MFN9F1ld2kyNVrkmoYTeGVOR2vMTt3if79GJl90Sfs0wUQETJ5xQ4IhyJDcE4cjF";


    const gifBtn =
      document.getElementById("gif-btn");

    const gifPicker =
      document.getElementById("gif-picker");

    const gifSearch =
      document.getElementById("gif-search");

    const gifResults =
      document.getElementById("gif-results");


    let gifDebounce = null;


    // OPEN GIF WINDOW
    gifBtn.onclick = function() {

      gifPicker.classList.toggle("show");

      if (gifPicker.classList.contains("show")) {

        gifSearch.value = "";

        gifSearch.focus();

        loadTrendingGifs();

      }

    };


    // SEARCH GIFS
    gifSearch.oninput = function() {

      clearTimeout(gifDebounce);

      const query =
        gifSearch.value.trim();

      gifDebounce = setTimeout(
        function() {

          if (query) {
            searchGifs(query);
          } else {
            loadTrendingGifs();
          }

        },
        350
      );

    };


    // TRENDING GIFS
    async function loadTrendingGifs() {

      gifResults.innerHTML =
        "<div id='gif-status'>" +
        "Loading GIFs..." +
        "</div>";

      try {

        const res = await fetch(
          "https://api.giphy.com/v1/gifs/trending" +
          "?api_key=" + GIPHY_API_KEY +
          "&limit=20" +
          "&rating=pg-13"
        );

        const data = await res.json();

        renderGifResults(data.data);

      }

      catch (error) {

        gifResults.innerHTML =
          "<div id='gif-status'>" +
          "Oops, GIFs did not load." +
          "</div>";

      }

    }


    // SEARCH GIFS
    async function searchGifs(query) {

      gifResults.innerHTML =
        "<div id='gif-status'>" +
        "Searching..." +
        "</div>";

      try {

        const res = await fetch(
          "https://api.giphy.com/v1/gifs/search" +
          "?api_key=" + GIPHY_API_KEY +
          "&q=" + encodeURIComponent(query) +
          "&limit=20" +
          "&rating=pg-13"
        );

        const data = await res.json();

        renderGifResults(data.data);

      }

      catch (error) {

        gifResults.innerHTML =
          "<div id='gif-status'>" +
          "Search didn't work." +
          "</div>";

      }

    }


    // SHOW GIFS
    function renderGifResults(gifs) {

      gifResults.innerHTML = "";

      if (!gifs || gifs.length === 0) {

        gifResults.innerHTML =
          "<div id='gif-status'>" +
          "No GIFs found :(" +
          "</div>";

        return;
      }


      gifs.forEach(function(gif) {

        const img =
          document.createElement("img");

        img.src =
          gif.images.fixed_width_small.url;

        img.alt =
          gif.title || "GIF";


        img.onclick = function() {

          sendGif(
            gif.images.fixed_width.url
          );

        };


        gifResults.appendChild(img);

      });

    }


    // SEND GIF
    function sendGif(url) {

      if (!roomRef) {
        return;
      }

      roomRef.push({

        user: username,

        gifUrl: url,

        time: Date.now()

      });

      gifPicker.classList.remove("show");

    }

  </script>

</body>
</html>
