    <style>
      body {font-family: "Segoe UI", Arial, sans-serif;margin: 0;padding: 0;background-color: #222222;color: #ffffff;}.navbar {background-color: #333333;padding: 10px;border-bottom: 2px solid #444444;overflow: hidden;}.navbar-title {float: left;font-size: 20px;font-weight: bold;margin-right: 20px;margin-top: 5px;}.search-container {float: left;width: 40%;}#search {width: 100%;padding: 8px;background-color: #ffffff;color: #000000;border: 1px solid #999999;}.nav-links {float: right;margin-top: 5px;}.chat-lnk {color: #5599ff;text-decoration: underline;margin-right: 15px;}#status {font-size: 13px;color: #bbbbbb;display: inline-block;}.main-container {width: 100%;height: calc(100vh - 55px);clear: both;}.left-sidebar {width: 280px;height: 100%;float: left;background-color: #2b2b2b;border-right: 2px solid #444444;padding: 15px;box-sizing: border-box;overflow-y: scroll;}.left-sidebar h2 {margin-top: 0;font-size: 16px;border-bottom: 1px solid #555555;padding-bottom: 5px;}.game-item-btn {width: 100%;background-color: #3e3e3e;color: white;border: 1px solid #555555;padding: 8px;margin-bottom: 6px;text-align: left;cursor: pointer;}.game-item-btn:hover {background-color: #4e4e4e;}.game-item-btn.active {background-color: #0055cc;border-color: #0077ff;}.game-title-text {font-weight: bold;font-size: 14px;}.game-filename-text {font-size: 11px;color: #aaaaaa;}.right-content {margin-left: 280px;height: 100%;position: relative;background-color: #111111;}#gameFrame {width: 100%;height: 100%;border: none;background-color: #ffffff;display: none;}#fullscreenButton {position: absolute;top: 10px;right: 10px;background-color: #0066cc;color: white;border: 1px solid #ffffff;padding: 6px 12px;cursor: pointer;font-size: 14px;}#fullscreenButton:hover {background-color: #0088ff;}.placeholder-message {padding: 40px;text-align: center;color: #888888;}#loadingStatus {position: absolute;top: 45%;left: 45%;background-color: #333333;border: 1px solid #ffffff;padding: 20px;display: none;text-align: center;}.error-box {background-color: #551111;border: 1px solid #ff3333;color: #ffcccc;padding: 10px;margin-top: 10px;font-size: 13px;}Game Library PrototypeOpen Chat LinkChecking files...Available GamesGo FullscreenNo Game SelectedPlease click a game title on the left menu list to launch it here.Loading...Fetching source files...var METADATA_URL = "archive.org";var API_URL = "vercel.app";var gamesListDiv = document.getElementById("gamesList");var searchInput = document.getElementById("search");var statusLabel = document.getElementById("status");var errorDiv = document.getElementById("errorMessage");var mainIframe = document.getElementById("gameFrame");var welcomeBox = document.getElementById("welcomeMessage");var loaderBox = document.getElementById("loadingStatus");var btnFullscreen = document.getElementById("fullscreenButton");var globalGamesArray = [];var activeGameObj = null;fn cleanGameTitle(rawFilename) {var tempName = rawFilename;if (tempName.toLowerCase().indexOf("cl") === 0) {tempName = tempName.substring(2);}if (tempName.toLowerCase().indexOf(".html") !== -1) {tempName = tempName.substring(0, tempName.length - 5);}tempName = tempName.split("-").join(" ");tempName = tempName.split("_").join(" ");return tempName;}function sanitizeText(strInput) {return String(strInput).replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">").replace(/"/g, """);}async function loadArchiveData() {statusLabel.innerHTML = "Connecting to Archive.org...";try {var res = await fetch(METADATA_URL, { cache: "no-store" });if (!res.ok) {throw new Error("HTTP error code received: " + res.status);}var parsedData = await res.json();var filesFound = parsedData.files;var filteredArray = [];for (var i = 0; i < filesFound.length; i++) {var currentFile = filesFound[i];if (currentFile.name.toLowerCase().endsWith(".html")) {filteredArray.push({filename: currentFile.name,name: cleanGameTitle(currentFile.name)});}}filteredArray.sort(function(a, b) {return a.name.localeCompare(b.name);});globalGamesArray = filteredArray;renderListView("");statusLabel.innerHTML = globalGamesArray.length + " items loaded successfully";} catch (err) {console.error(err);statusLabel.innerHTML = "Error loading list";errorDiv.innerHTML = "Failed to load data: " + sanitizeText(err.message) + "";}}function renderListView(filterKeyword) {gamesListDiv.innerHTML = "";var searchWord = filterKeyword.toLowerCase().trim();var countMatched = 0;for (var i = 0; i < globalGamesArray.length; i++) {var singleGame = globalGamesArray[i];if (searchWord !== "") {if (singleGame.name.toLowerCase().indexOf(searchWord) === -1 &&singleGame.filename.toLowerCase().indexOf(searchWord) === -1) {continue;}}countMatched++;var btn = document.createElement("button");btn.type = "button";btn.className = "game-item-btn";if (activeGameObj && activeGameObj.filename === singleGame.filename) {btn.className = "game-item-btn active";}btn.innerHTML = "" + sanitizeText(singleGame.name) + "" +"" + sanitizeText(singleGame.filename) + "";(function(itemData) {btn.onclick = function() {startRunningGame(itemData);};})(singleGame);gamesListDiv.appendChild(btn);}if (countMatched === 0) {gamesListDiv.innerHTML = "No items match query.";}}async function triggerFullscreenMode() {try {if (mainIframe.requestFullscreen) {await mainIframe.requestFullscreen();}} catch (error) {alert("Fullscreen action rejected by browser standard properties.");}}btnFullscreen.onclick = function() {triggerFullscreenMode();};document.addEventListener("fullscreenchange", function() {var activeFS = document.fullscreenElement;if (activeFS !== null) {btnFullscreen.style.display = "none";} else {if (mainIframe.style.display === "block") {btnFullscreen.style.display = "block";}}});async function startRunningGame(gameObj) {activeGameObj = gameObj;renderListView(searchInput.value);if (document.fullscreenElement) {try {await document.exitFullscreen();} catch(e) {}}welcomeBox.style.display = "none";mainIframe.style.display = "none";btnFullscreen.style.display = "none";loaderBox.style.display = "block";errorDiv.innerHTML = "";try {var targetUrl = API_URL + encodeURIComponent(gameObj.filename);var apiResponse = await fetch(targetUrl);if (!apiResponse.ok) {throw new Error("Target API failed with status " + apiResponse.status);}var textHtmlResult = await apiResponse.text();mainIframe.srcdoc = textHtmlResult;mainIframe.onload = function() {loaderBox.style.display = "none";mainIframe.style.display = "block";btnFullscreen.style.display = "block";};} catch (fetchError) {console.error(fetchError);loaderBox.style.display = "none";btnFullscreen.style.display = "none";errorDiv.innerHTML = "Error launching game file" + sanitizeText(fetchError.message) + "";}}searchInput.oninput = function() {renderListView(searchInput.value);};loadArchiveData();
