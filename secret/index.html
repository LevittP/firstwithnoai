<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game Library</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eee;
      color: #222;
    }

    .topbar {
      height: 55px;
      background: #ddd;
      border-bottom: 1px solid #aaa;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    #search {
      width: 300px;
      padding: 8px;
      border: 1px solid #999;
      border-radius: 3px;
    }

    .chat-button {
      width: 35px;
      height: 35px;
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ccc;
      border: 1px solid #999;
      color: #222;
      text-decoration: none;
      border-radius: 3px;
    }

    .chat-button svg {
      width: 18px;
      height: 18px;
    }

    .status {
      font-size: 12px;
      color: #555;
    }

    .layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    .sidebar {
      width: 250px;
      background: #f5f5f5;
      border-right: 1px solid #aaa;
      padding: 10px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-top: 5px;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .game {
      background: white;
      border: 1px solid #bbb;
      padding: 9px;
      cursor: pointer;
      text-align: left;
      border-radius: 3px;
    }

    .game:hover {
      background: #e8e8e8;
    }

    .game.active {
      background: #cfe2ff;
      border-color: #6699cc;
    }

    .game-name {
      font-size: 14px;
    }

    .game-file {
      font-size: 10px;
      color: #777;
      margin-top: 3px;
    }

    .content {
      flex: 1;
      position: relative;
      background: #111;
    }

    #gameFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .welcome {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #aaa;
    }

    .welcome h1 {
      color: white;
      margin-bottom: 5px;
    }

    .loading {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .loading.show {
      display: flex;
    }

    .fullscreen-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: #2477d4;
      color: white;
      border: 1px solid #15599f;
      border-radius: 3px;
      width: 35px;
      height: 35px;
      cursor: pointer;
      font-size: 18px;
    }

    .error {
      margin-top: 10px;
      padding: 8px;
      background: #ffdada;
      border: 1px solid #dd9999;
      color: #990000;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 180px;
      }

      .title {
        display: none;
      }

      .status {
        display: none;
      }

      #search {
        width: 200px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">

    <div class="title">Game Library</div>

    <input
      id="search"
      type="text"
      placeholder="Search games..."
    >

    <a
      href="/chatting"
      class="chat-button"
      title="Chat"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </a>

    <div id="status">
      Scanning...
    </div>

  </div>


  <div class="layout">

    <div class="sidebar">

      <h2>Games</h2>

      <div id="games" class="games"></div>

      <div id="error"></div>

    </div>


    <div class="content">

      <button
        id="fullscreenButton"
        class="fullscreen-button"
        style="display:none;"
      >
        ⛶
      </button>

      <div id="welcome" class="welcome">
        <h1>Select a game</h1>
        <p>Select a game from the list.</p>
      </div>

      <div id="loading" class="loading">
        Loading game...
      </div>

      <iframe
        id="gameFrame"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>

    </div>

  </div>


  <script>

    const METADATA_URL =
      "https://archive.org/metadata/ugsfiles";

    const API_URL =
      "https://molineshop.vercel.app/api/game?file=";


    const gamesElement =
      document.getElementById("games");

    const searchElement =
      document.getElementById("search");

    const statusElement =
      document.getElementById("status");

    const errorElement =
      document.getElementById("error");

    const frame =
      document.getElementById("gameFrame");

    const welcome =
      document.getElementById("welcome");

    const loading =
      document.getElementById("loading");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    let games = [];
    let selectedGame = null;


    function getDisplayName(filename) {

      let name = filename;

      if (name.toLowerCase().startsWith("cl")) {
        name = name.substring(2);
      }

      if (name.toLowerCase().endsWith(".html")) {
        name = name.substring(0, name.length - 5);
      }

      return name
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    async function scanGames() {

      try {

        statusElement.textContent =
          "Scanning...";

        const response =
          await fetch(
            METADATA_URL,
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "Archive.org returned HTTP " +
            response.status
          );
        }

        const metadata =
          await response.json();

        games =
          metadata.files
            .map(file => file.name)
            .filter(filename =>
              filename
                .toLowerCase()
                .endsWith(".html")
            )
            .map(filename => ({
              filename: filename,
              name: getDisplayName(filename)
            }))
            .sort((a, b) =>
              a.name.localeCompare(
                b.name,
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )
            );

        renderGames();

        statusElement.textContent =
          games.length + " games found";

      } catch (error) {

        console.error(error);

        statusElement.textContent =
          "Scan failed";

        errorElement.innerHTML =
          '<div class="error">' +
          escapeHTML(error.message) +
          '</div>';
      }
    }


    function renderGames(filter = "") {

      gamesElement.innerHTML = "";

      const query =
        filter.toLowerCase().trim();

      const visibleGames =
        games.filter(game =>
          game.name
            .toLowerCase()
            .includes(query) ||
          game.filename
            .toLowerCase()
            .includes(query)
        );


      for (const game of visibleGames) {

        const button =
          document.createElement("button");

        button.className = "game";

        if (
          selectedGame &&
          selectedGame.filename === game.filename
        ) {
          button.classList.add("active");
        }

        button.innerHTML =
          '<div class="game-name">' +
          escapeHTML(game.name) +
          '</div>' +
          '<div class="game-file">' +
          escapeHTML(game.filename) +
          '</div>';

        button.onclick = function() {
          launchGame(game);
        };

        gamesElement.appendChild(button);
      }


      if (visibleGames.length === 0) {

        gamesElement.innerHTML =
          '<div style="padding:10px;color:#777;">' +
          'No games found.' +
          '</div>';
      }
    }


    async function enterFullscreen() {

      try {

        if (frame.requestFullscreen) {
          await frame.requestFullscreen();
        }

      } catch (error) {

        console.error(error);

      }
    }


    fullscreenButton.onclick =
      enterFullscreen;


    document.addEventListener(
      "fullscreenchange",
      function() {

        if (document.fullscreenElement) {

          fullscreenButton.style.display =
            "none";

        } else if (
          frame.style.display === "block"
        ) {

          fullscreenButton.style.display =
            "block";
        }
      }
    );


    async function launchGame(game) {

      selectedGame = game;

      renderGames(
        searchElement.value
      );


      if (document.fullscreenElement) {

        try {
          await document.exitFullscreen();
        } catch (error) {
          console.error(error);
        }
      }


      welcome.style.display = "none";

      frame.style.display = "none";

      fullscreenButton.style.display =
        "none";

      loading.classList.add("show");

      errorElement.innerHTML = "";


      try {

        const response =
          await fetch(
            API_URL +
            encodeURIComponent(game.filename)
          );


        if (!response.ok) {

          const data =
            await response
              .json()
              .catch(() => null);

          throw new Error(
            data?.error ||
            "Server returned HTTP " +
            response.status
          );
        }


        const html =
          await response.text();

        frame.srcdoc = html;


        frame.onload = function() {

          loading.classList.remove("show");

          frame.style.display = "block";

          fullscreenButton.style.display =
            "block";
        };


      } catch (error) {

        console.error(error);

        loading.classList.remove("show");

        fullscreenButton.style.display =
          "none";

        errorElement.innerHTML =
          '<div class="error">' +
          '<b>Game failed to load</b>' +
          '<br><br>' +
          escapeHTML(error.message) +
          '</div>';
      }
    }


    searchElement.addEventListener(
      "input",
      function() {
        renderGames(searchElement.value);
      }
    );


    scanGames();

  </script>

</body>
</html>
